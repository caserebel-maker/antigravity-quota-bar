<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Quota Status · Live Dashboard</title>
  
  <!-- Apple & PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quota Bar">
  <meta name="theme-color" content="#07090e">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.35);
      --accent-yellow: #f59e0b;
      --accent-yellow-glow: rgba(245, 158, 11, 0.35);
      --accent-red: #ef4444;
      --accent-red-glow: rgba(239, 68, 68, 0.35);
      
      --font-sans: 'Plus Jakarta Sans', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      overscroll-behavior-y: contain;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.09) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.09) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 16px) 12px env(safe-area-inset-bottom, 24px) 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Pull to Refresh Indicator */
    .ptr-indicator {
      position: fixed;
      top: env(safe-area-inset-top, 14px);
      left: 50%;
      transform: translate(-50%, -130%);
      z-index: 9999;
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.2s ease;
      opacity: 0;
    }

    .ptr-box {
      background: rgba(17, 24, 39, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 0 16px rgba(16, 185, 129, 0.25);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 8px 18px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .ptr-icon-wrap {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .ptr-arrow {
      color: #38bdf8;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s;
    }

    .ptr-spinner {
      display: none;
      animation: ptr-spin 0.75s linear infinite;
    }

    @keyframes ptr-spin {
      100% { transform: rotate(360deg); }
    }

    .ptr-indicator.ready .ptr-arrow {
      transform: rotate(180deg);
      color: var(--accent-green);
    }

    .ptr-indicator.refreshing .ptr-arrow {
      display: none;
    }

    .ptr-indicator.refreshing .ptr-spinner {
      display: block;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      will-change: transform;
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1);
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px 18px 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      font-size: 18px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.2s;
    }

    .sync-status:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.1);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Section & Long Capsule Headers */
    .section {
      margin-bottom: 22px;
    }

    .section-capsule {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 7px 14px;
      border-radius: 9999px;
      margin-bottom: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-sizing: border-box;
      position: relative;
    }

    .capsule-icon {
      font-size: 13px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .capsule-title {
      white-space: nowrap;
    }

    .capsule-line {
      flex: 1;
      height: 1.5px;
      border-radius: 99px;
    }

    /* 1. Claude: สีส้ม */
    .capsule-claude {
      background: linear-gradient(90deg, rgba(249, 115, 22, 0.24) 0%, rgba(249, 115, 22, 0.08) 60%, rgba(249, 115, 22, 0.02) 100%);
      border: 1.5px solid rgba(249, 115, 22, 0.5);
      box-shadow: 0 0 16px rgba(249, 115, 22, 0.2), inset 0 0 12px rgba(249, 115, 22, 0.08);
      color: #fb923c;
    }

    .capsule-claude .capsule-line {
      background: linear-gradient(90deg, rgba(249, 115, 22, 0.8), rgba(249, 115, 22, 0.2) 70%, transparent);
    }

    /* 2. Antigravity: สีรุ้ง */
    .capsule-antigravity {
      border: 1.5px solid transparent;
      background: 
        linear-gradient(rgba(17, 24, 39, 0.85), rgba(17, 24, 39, 0.85)) padding-box,
        linear-gradient(90deg, #ff007f, #9333ea, #3b82f6, #06b6d4, #10b981) border-box;
      box-shadow: 0 0 18px rgba(147, 51, 234, 0.28), inset 0 0 14px rgba(59, 130, 246, 0.08);
    }

    .capsule-antigravity .capsule-title {
      background: linear-gradient(90deg, #ff4986, #c084fc, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .capsule-antigravity .capsule-line {
      background: linear-gradient(90deg, #ff4986, #c084fc, #60a5fa, #34d399, transparent);
    }

    /* 3. OpenAI Codex: สีฟ้า */
    .capsule-codex {
      background: linear-gradient(90deg, rgba(14, 165, 233, 0.24) 0%, rgba(56, 189, 248, 0.08) 60%, rgba(56, 189, 248, 0.02) 100%);
      border: 1.5px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 16px rgba(14, 165, 233, 0.2), inset 0 0 12px rgba(56, 189, 248, 0.08);
      color: #38bdf8;
    }

    .capsule-codex .capsule-line {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.8), rgba(56, 189, 248, 0.2) 70%, transparent);
    }

    /* 4. Quota Pools: สีเขียวมรกต */
    .capsule-pools {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.22) 0%, rgba(16, 185, 129, 0.06) 60%, rgba(16, 185, 129, 0.02) 100%);
      border: 1.5px solid rgba(16, 185, 129, 0.45);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.18), inset 0 0 12px rgba(16, 185, 129, 0.06);
      color: #34d399;
    }

    .capsule-pools .capsule-line {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.8), rgba(16, 185, 129, 0.2) 70%, transparent);
    }

    /* 3-Column Grid Layout */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    /* Circle Chart Card */
    .quota-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 14px;
      padding: 10px 4px 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .quota-card:active {
      transform: scale(0.97);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Circular Progress Ring */
    .circle-wrap {
      position: relative;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0 6px 0;
    }

    .circle-wrap svg {
      width: 70px;
      height: 70px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      stroke: rgba(255, 255, 255, 0.08);
      fill: none;
    }

    .ring-progress {
      fill: none;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stroke-green {
      stroke: var(--accent-green);
      filter: drop-shadow(0 0 5px var(--accent-green-glow));
    }

    .stroke-yellow {
      stroke: var(--accent-yellow);
      filter: drop-shadow(0 0 5px var(--accent-yellow-glow));
    }

    .stroke-red {
      stroke: var(--accent-red);
      filter: drop-shadow(0 0 5px var(--accent-red-glow));
    }

    /* Center Text in Ring */
    .circle-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .pct-val {
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.3px;
    }

    .pct-val.green { color: var(--accent-green); }
    .pct-val.yellow { color: var(--accent-yellow); }
    .pct-val.red { color: var(--accent-red); }

    .pct-sub {
      font-size: 8px;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Model Title */
    .model-title {
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      padding: 0 4px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }

    /* Reset Timer Badge */
    .reset-badge {
      font-size: 9px;
      font-family: var(--font-mono);
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 2px 4px;
      margin-top: 4px;
      width: 94%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .reset-clock {
      font-size: 8.5px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      margin-top: 2px;
      white-space: nowrap;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 16px 0 30px 0;
      color: var(--text-dim);
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 9px 18px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .refresh-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.12);
    }

    /* Skeleton Loading */
    .skeleton-capsule {
      width: 100%;
      height: 32px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 12px;
      animation: pulse 1.5s infinite;
    }

    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .skeleton-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      height: 145px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .skeleton-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      animation: pulse 1.5s infinite;
    }

    .skeleton-bar {
      width: 70%;
      height: 12px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      animation: pulse 1.5s infinite;
    }
  </style>
</head>
<body>
  <!-- Pull to Refresh Floating Indicator -->
  <div id="ptr" class="ptr-indicator">
    <div class="ptr-box">
      <div class="ptr-icon-wrap">
        <svg class="ptr-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M19 12l-7 7-7-7"/>
        </svg>
        <svg class="ptr-spinner" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.15)"/>
          <path d="M12 3a9 9 0 0 1 9 9" stroke="#10b981" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="ptr-text" id="ptr-text">ดึงลงเพื่อรีเฟรช</span>
    </div>
  </div>

  <div class="container">
    <header>
      <div class="brand">
        <div class="logo-icon">⚡</div>
        <div>
          <div class="brand-title">Quota Status</div>
          <div class="brand-sub" id="user-email">Loading...</div>
        </div>
      </div>
      <div class="sync-status" onclick="fetchData(true)">
        <span class="pulse-dot" id="pulse-dot"></span>
        <span id="sync-time">Syncing...</span>
      </div>
    </header>

    <main id="content">
      <div class="section">
        <div class="skeleton-capsule"></div>
        <div class="skeleton-grid">
          <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-bar"></div></div>
          <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-bar"></div></div>
          <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-bar"></div></div>
        </div>
      </div>
    </main>

    <footer>
      <button class="refresh-btn" onclick="fetchData(true)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        Refresh Now
      </button>
      <div>forevier.com/quota · Antigravity & Claude</div>
    </footer>
  </div>

  <script>
    let rawData = null;
    const RING_CIRCUMFERENCE = 2 * Math.PI * 28; // ~175.929 (r = 28)

    function formatTime(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function formatClock(targetDate) {
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const now = new Date();
      const diffMs = targetDate.getTime() - now.getTime();
      const h = String(targetDate.getHours()).padStart(2, '0');
      const m = String(targetDate.getMinutes()).padStart(2, '0');
      
      if (diffMs > 24 * 3600 * 1000) {
        return `${days[targetDate.getDay()]} ${h}:${m}`;
      }
      return `${h}:${m}`;
    }

    function formatCountdown(targetDate) {
      const now = new Date();
      let diffSec = Math.max(0, Math.floor((targetDate.getTime() - now.getTime()) / 1000));
      if (diffSec <= 0) return 'Ready';
      
      const days = Math.floor(diffSec / 86400);
      diffSec %= 86400;
      const hours = Math.floor(diffSec / 3600);
      diffSec %= 3600;
      const mins = Math.floor(diffSec / 60);
      const secs = diffSec % 60;

      if (days > 0) {
        return `${days}d ${hours}h`;
      } else if (hours > 0) {
        return `${hours}h ${mins}m`;
      } else {
        return `${mins}m ${secs}s`;
      }
    }

    function getColorClass(pct) {
      if (pct <= 0.20) return 'red';
      if (pct <= 0.50) return 'yellow';
      return 'green';
    }

    function formatCardTitle(label) {
      if (label === 'Claude App (5h)') return 'Claude 5h';
      if (label === 'Claude App (Weekly)') return 'Claude Wk';
      if (label === 'Gemini 5h') return 'Gemini 5h';
      if (label === 'Gemini Weekly') return 'Gemini Wk';
      if (label === 'Claude/GPT 5h') return 'Claude/GPT 5h';
      if (label === 'Claude/GPT Weekly') return 'Claude/GPT Wk';
      if (label === 'Argon Weekly') return 'Argon Wk';
      if (label.includes('3.8')) return 'Gemini 3.8';
      if (label.includes('Argon')) return 'Argon 4';
      if (label.includes('Opus')) return 'Opus 5.5';
      if (label.includes('Sonnet')) return 'Sonnet 5.5';
      if (label.includes('Codex 5h')) return 'Codex 5h';
      if (label.includes('Codex Weekly')) return 'Codex Wk';
      return label.replace(' (High)', '').replace(' (Medium)', '');
    }

    function renderUI() {
      if (!rawData || !rawData.models) return;

      const emailEl = document.getElementById('user-email');
      if (emailEl) emailEl.innerText = rawData.email || 'User';

      const models = rawData.models.filter(m => {
        const lbl = m.label;
        if (lbl.includes('3.1') || lbl.includes('3.6')) return false;
        if (lbl.includes('GPT-OSS') || lbl.toLowerCase().includes('gptoss')) return false;
        if (lbl.includes('3.7') && lbl.includes('Low')) return false;
        
        // Claude Sonnet & Opus: keep High
        if ((lbl.includes('Sonnet') || lbl.includes('Opus') || lbl.includes('Claude')) && !lbl.startsWith('Claude App')) {
          if (!lbl.includes('Claude/GPT')) {
            if (!lbl.includes('(High)') && !lbl.includes('(Hi')) return false;
          }
        }
        
        // Gemini 3.8: keep High
        if (lbl.includes('3.8')) {
          if (!lbl.includes('(High)') && !lbl.includes('(Hi')) return false;
        }

        // Gemini 4 Argon: keep High
        if (lbl.includes('Argon') && !lbl.includes('Weekly')) {
          if (!lbl.includes('(High)') && !lbl.includes('(Hi')) return false;
        }

        return true;
      });

      // Categories
      const claudeApp = models.filter(m => m.label.startsWith('Claude App'))
        .sort((a, b) => {
          const wA = a.label.includes('5h') ? 1 : 2;
          const wB = b.label.includes('5h') ? 1 : 2;
          return wA - wB;
        });

      const pools = models.filter(m => 
        ['Gemini 5h', 'Gemini Weekly', 'Claude/GPT 5h', 'Claude/GPT Weekly', 'Argon Weekly'].includes(m.label)
      );

      const agyModels = models.filter(m => 
        m.label.includes('3.8') || 
        (m.label.includes('Argon') && !m.label.includes('Weekly')) ||
        ((m.label.includes('Sonnet') || m.label.includes('Opus')) && !m.label.includes('Weekly') && !m.label.includes('5h') && !m.label.startsWith('Claude App'))
      );

      const codex = models.filter(m => m.label.startsWith('Codex'));

      function renderGroup(title, groupModels, capsuleType = 'pools', icon = '📊') {
        if (!groupModels || groupModels.length === 0) return '';
        
        const cardsHtml = groupModels.map(m => {
          const pct = Math.max(0, Math.min(1, m.remainingPercentage ?? 1));
          const pctVal = Math.round(pct * 100);
          const color = getColorClass(pct);
          
          // SVG Circle Dashoffset calculation
          const offset = RING_CIRCUMFERENCE * (1 - pct);
          
          let targetDate = null;
          if (m.resetTime) {
            targetDate = new Date(m.resetTime);
          } else if (m.timeUntilResetMs && m.timeUntilResetMs > 0) {
            const uploadedAt = rawData.updatedAt ? new Date(rawData.updatedAt).getTime() : Date.now();
            targetDate = new Date(uploadedAt + m.timeUntilResetMs);
          }

          let countdownStr = 'Full Quota';
          let clockStr = '';
          if (targetDate && targetDate > new Date()) {
            countdownStr = `⏱ ${formatCountdown(targetDate)}`;
            clockStr = `@ ${formatClock(targetDate)}`;
          } else if (m.isExhausted) {
            countdownStr = 'Exhausted';
          }

          const cardTitle = formatCardTitle(m.label);

          return `
            <div class="quota-card">
              <div class="circle-wrap">
                <svg viewBox="0 0 70 70">
                  <circle class="ring-bg" cx="35" cy="35" r="28" stroke-width="5" />
                  <circle class="ring-progress stroke-${color}" cx="35" cy="35" r="28" stroke-width="5"
                    stroke-dasharray="${RING_CIRCUMFERENCE.toFixed(2)}"
                    stroke-dashoffset="${offset.toFixed(2)}" />
                </svg>
                <div class="circle-text">
                  <span class="pct-val ${color}">${pctVal}%</span>
                  <span class="pct-sub">left</span>
                </div>
              </div>
              <div class="model-title">${cardTitle}</div>
              <div class="reset-badge">${countdownStr}</div>
              <div class="reset-clock">${clockStr || '&nbsp;'}</div>
            </div>
          `;
        }).join('');

        return `
          <div class="section">
            <div class="section-capsule capsule-${capsuleType}">
              <span class="capsule-icon">${icon}</span>
              <span class="capsule-title">${title}</span>
              <span class="capsule-line"></span>
            </div>
            <div class="cards-grid">
              ${cardsHtml}
            </div>
          </div>
        `;
      }

      let html = '';
      if (claudeApp.length > 0) {
        html += renderGroup('Claude App · Official Sub', claudeApp, 'claude', '🟠');
      }
      html += renderGroup('Quota Pools · Summary', pools, 'pools', '📊');
      if (agyModels.length > 0) {
        html += renderGroup('Antigravity Models', agyModels, 'antigravity', '🌈');
      }
      if (codex.length > 0) {
        html += renderGroup('OpenAI Codex', codex, 'codex', '🔷');
      }

      document.getElementById('content').innerHTML = html;
    }

    async function fetchData(manual = false) {
      const pulseDot = document.getElementById('pulse-dot');
      const syncTimeEl = document.getElementById('sync-time');
      
      try {
        const res = await fetch(`quota.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('Network error');
        rawData = await res.json();
        
        renderUI();
        
        const now = new Date();
        syncTimeEl.innerText = `${formatTime(now)}`;
        pulseDot.style.background = '#10b981';
        pulseDot.style.boxShadow = '0 0 8px #10b981';
      } catch (err) {
        console.error(err);
        syncTimeEl.innerText = 'Offline';
        pulseDot.style.background = '#ef4444';
        pulseDot.style.boxShadow = '0 0 8px #ef4444';
      }
    }

    // Pull-to-refresh logic
    (function initPullToRefresh() {
      const ptr = document.getElementById('ptr');
      const ptrText = document.getElementById('ptr-text');
      const container = document.querySelector('.container');
      
      let startY = 0;
      let currentY = 0;
      let isPulling = false;
      let isRefreshing = false;
      let hasHapticFired = false;
      const PULL_THRESHOLD = 68; // px threshold
      const MAX_PULL = 110;

      function onStart(pageY) {
        if (isRefreshing) return false;
        if (window.scrollY <= 2) {
          startY = pageY;
          currentY = pageY;
          isPulling = true;
          hasHapticFired = false;
          container.style.transition = 'none';
          ptr.style.transition = 'none';
          return true;
        }
        return false;
      }

      function onMove(pageY, cancelableEvent) {
        if (!isPulling || isRefreshing) return;
        
        currentY = pageY;
        const diff = currentY - startY;

        if (diff > 0 && window.scrollY <= 2) {
          if (cancelableEvent && cancelableEvent.cancelable) {
            cancelableEvent.preventDefault();
          }

          const pullDist = Math.min(MAX_PULL, Math.pow(diff, 0.85));
          const opacity = Math.min(1, pullDist / 30);
          
          ptr.style.opacity = opacity;
          ptr.style.transform = `translate(-50%, ${pullDist - 12}px)`;
          container.style.transform = `translateY(${pullDist * 0.42}px)`;

          if (pullDist >= PULL_THRESHOLD) {
            ptr.classList.add('ready');
            ptrText.innerText = 'ปล่อยเพื่อรีเฟรช';
            if (!hasHapticFired) {
              if (navigator.vibrate) navigator.vibrate(15);
              hasHapticFired = true;
            }
          } else {
            ptr.classList.remove('ready');
            ptrText.innerText = 'ดึงลงเพื่อรีเฟรช';
            hasHapticFired = false;
          }
        } else if (diff < 0) {
          isPulling = false;
          resetPTR();
        }
      }

      async function onEnd() {
        if (!isPulling || isRefreshing) return;
        isPulling = false;

        const diff = currentY - startY;
        const pullDist = Math.min(MAX_PULL, Math.pow(Math.max(0, diff), 0.85));

        if (pullDist >= PULL_THRESHOLD && window.scrollY <= 2) {
          isRefreshing = true;
          ptr.classList.remove('ready');
          ptr.classList.add('refreshing');
          ptrText.innerText = 'กำลังอัปเดต...';
          
          ptr.style.transition = 'transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1), opacity 0.2s';
          ptr.style.transform = 'translate(-50%, 28px)';
          ptr.style.opacity = '1';
          
          container.style.transition = 'transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1)';
          container.style.transform = 'translateY(45px)';

          const minWait = new Promise(r => setTimeout(r, 600));
          try {
            await Promise.all([fetchData(true), minWait]);
            ptrText.innerText = 'อัปเดตเรียบร้อย!';
            if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
          } catch (_) {
            ptrText.innerText = 'ออฟไลน์';
          }

          setTimeout(() => {
            resetPTR();
            setTimeout(() => {
              ptr.classList.remove('refreshing');
              isRefreshing = false;
            }, 300);
          }, 450);
        } else {
          resetPTR();
        }
      }

      function resetPTR() {
        ptr.style.transition = 'transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1), opacity 0.25s';
        ptr.style.transform = 'translate(-50%, -130%)';
        ptr.style.opacity = '0';
        ptr.classList.remove('ready');

        container.style.transition = 'transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1)';
        container.style.transform = 'translateY(0)';
      }

      // Touch events (Mobile devices)
      window.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches[0]) onStart(e.touches[0].pageY);
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches[0]) onMove(e.touches[0].pageY, e);
      }, { passive: false });

      window.addEventListener('touchend', onEnd, { passive: true });
      window.addEventListener('touchcancel', onEnd, { passive: true });

      // Mouse events (Desktop browser simulation)
      let isMouseDown = false;
      window.addEventListener('mousedown', (e) => {
        if (e.button === 0 && onStart(e.pageY)) {
          isMouseDown = true;
        }
      });
      window.addEventListener('mousemove', (e) => {
        if (isMouseDown) onMove(e.pageY, e);
      });
      window.addEventListener('mouseup', () => {
        if (isMouseDown) {
          isMouseDown = false;
          onEnd();
        }
      });
    })();

    // Initial load
    fetchData();

    // Auto fetch from cloud every 30 seconds
    setInterval(() => fetchData(), 30000);

    // Live tick for countdowns every 1 second
    setInterval(() => {
      if (rawData) renderUI();
    }, 1000);
  </script>
</body>
</html>
