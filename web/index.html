<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Quota Status</title>
  
  <!-- Apple & PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quota Bar">
  <meta name="theme-color" content="#0a0e17">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.04);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      
      --accent-green: #10b981;
      --accent-green-bg: rgba(16, 185, 129, 0.15);
      --accent-yellow: #f59e0b;
      --accent-yellow-bg: rgba(245, 158, 11, 0.15);
      --accent-red: #ef4444;
      --accent-red-bg: rgba(239, 68, 68, 0.15);
      
      --font-sans: 'Plus Jakarta Sans', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 30px) 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding-top: 10px;
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 20px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      font-size: 18px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.2s;
    }

    .sync-status:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.1);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Section */
    .section {
      margin-bottom: 22px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }

    /* Cards Group */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quota-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 14px 16px;
      transition: transform 0.15s, border-color 0.15s;
    }

    .quota-card:active {
      transform: scale(0.99);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .model-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-tier {
      font-size: 10px;
      font-weight: 700;
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .pct-badge {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
    }

    .pct-green {
      color: var(--accent-green);
      background: var(--accent-green-bg);
    }

    .pct-yellow {
      color: var(--accent-yellow);
      background: var(--accent-yellow-bg);
    }

    .pct-red {
      color: var(--accent-red);
      background: var(--accent-red-bg);
    }

    /* Progress Bar */
    .bar-bg {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fill-green {
      background: linear-gradient(90deg, #10b981, #34d399);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }

    .fill-yellow {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    .fill-red {
      background: linear-gradient(90deg, #ef4444, #f87171);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }

    /* Reset Row */
    .reset-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .reset-countdown {
      color: var(--text-muted);
      font-weight: 500;
    }

    .reset-clock {
      color: #94a3b8;
      font-weight: 600;
    }

    /* Bottom Refresh / Footer */
    footer {
      text-align: center;
      padding: 20px 0 30px 0;
      color: var(--text-dim);
      font-size: 12px;
      font-family: var(--font-mono);
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .refresh-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.12);
    }

    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 6px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo-icon">⚡</div>
        <div>
          <div class="brand-title">Quota Status</div>
          <div class="brand-sub" id="user-email">Loading...</div>
        </div>
      </div>
      <div class="sync-status" onclick="fetchData(true)">
        <span class="pulse-dot" id="pulse-dot"></span>
        <span id="sync-time">Syncing...</span>
      </div>
    </header>

    <main id="content">
      <!-- Skeleton placeholder -->
      <div class="section">
        <div class="cards-list">
          <div class="quota-card" style="height: 80px;">
            <div class="skeleton" style="width: 50%; height: 16px; margin-bottom: 14px;"></div>
            <div class="skeleton" style="width: 100%; height: 8px;"></div>
          </div>
          <div class="quota-card" style="height: 80px;">
            <div class="skeleton" style="width: 40%; height: 16px; margin-bottom: 14px;"></div>
            <div class="skeleton" style="width: 100%; height: 8px;"></div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <button class="refresh-btn" onclick="fetchData(true)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        Refresh Now
      </button>
      <div>forevier.com/quota · Antigravity & Codex</div>
    </footer>
  </div>

  <script>
    let rawData = null;
    let timerInterval = null;

    function formatTime(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function formatClock(targetDate) {
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const now = new Date();
      const diffMs = targetDate.getTime() - now.getTime();
      const h = String(targetDate.getHours()).padStart(2, '0');
      const m = String(targetDate.getMinutes()).padStart(2, '0');
      
      if (diffMs > 24 * 3600 * 1000) {
        return `${days[targetDate.getDay()]} ${h}:${m}`;
      }
      return `${h}:${m}`;
    }

    function formatCountdown(targetDate) {
      const now = new Date();
      let diffSec = Math.max(0, Math.floor((targetDate.getTime() - now.getTime()) / 1000));
      if (diffSec <= 0) return 'Ready to reset';
      
      const days = Math.floor(diffSec / 86400);
      diffSec %= 86400;
      const hours = Math.floor(diffSec / 3600);
      diffSec %= 3600;
      const mins = Math.floor(diffSec / 60);
      const secs = diffSec % 60;

      if (days > 0) {
        return `${days}d ${hours}h`;
      } else if (hours > 0) {
        return `${hours}h ${mins}m`;
      } else {
        return `${mins}m ${secs}s`;
      }
    }

    function getColorClass(pct) {
      if (pct <= 0.20) return 'red';
      if (pct <= 0.50) return 'yellow';
      return 'green';
    }

    function cleanLabel(label) {
      return label
        .replace('Claude ', '')
        .replace(' Flash ', ' ')
        .replace(' 4.6 (Thinking)', ' 4.6 (Think)')
        .replace(' 120B (Medium)', ' (Med)')
        .replace(' (Medium)', ' (Med)')
        .replace(' (Thinking)', ' (Think)');
    }

    function renderUI() {
      if (!rawData || !rawData.models) return;

      const emailEl = document.getElementById('user-email');
      if (emailEl) emailEl.innerText = rawData.email || 'User';

      const models = rawData.models.filter(m => {
        const lbl = m.label;
        if (lbl.includes('3.1') || lbl.includes('3.6')) return false;
        if (lbl.includes('GPT-OSS') || lbl.toLowerCase().includes('gptoss')) return false;
        if (lbl.includes('3.7') && lbl.includes('Low')) return false;
        
        // Claude Sonnet & Opus: only keep High
        if (lbl.includes('Sonnet') || lbl.includes('Opus') || lbl.includes('Claude')) {
          if (!lbl.includes('Claude/GPT')) {
            if (!lbl.includes('(High)') && !lbl.includes('(Hi')) return false;
          }
        }
        
        // Gemini 3.8: only keep High
        if (lbl.includes('3.8')) {
          if (!lbl.includes('(High)') && !lbl.includes('(Hi')) return false;
        }

        return true;
      });

      // Categories
      const pools = models.filter(m => 
        ['Gemini 5h', 'Gemini Weekly', 'Claude/GPT 5h', 'Claude/GPT Weekly', 'Argon Weekly'].includes(m.label)
      );

      const gemini38 = models.filter(m => m.label.includes('3.8'));
      const argon = models.filter(m => m.label.includes('Argon') && !m.label.includes('Weekly'));
      const claude = models.filter(m => (m.label.includes('Sonnet') || m.label.includes('Opus')) && !m.label.includes('Weekly') && !m.label.includes('5h'));
      const codex = models.filter(m => m.label.startsWith('Codex'));

      function renderGroup(title, groupModels) {
        if (!groupModels || groupModels.length === 0) return '';
        
        const cardsHtml = groupModels.map(m => {
          const pct = Math.max(0, Math.min(1, m.remainingPercentage ?? 1));
          const pctVal = Math.round(pct * 100);
          const color = getColorClass(pct);
          
          let targetDate = null;
          if (m.resetTime) {
            targetDate = new Date(m.resetTime);
          } else if (m.timeUntilResetMs && m.timeUntilResetMs > 0) {
            const uploadedAt = rawData.updatedAt ? new Date(rawData.updatedAt).getTime() : Date.now();
            targetDate = new Date(uploadedAt + m.timeUntilResetMs);
          }

          let countdownStr = '';
          let clockStr = '';
          if (targetDate && targetDate > new Date()) {
            countdownStr = `Resets in ${formatCountdown(targetDate)}`;
            clockStr = `@ ${formatClock(targetDate)}`;
          } else if (m.isExhausted) {
            countdownStr = 'Quota exhausted';
          }

          return `
            <div class="quota-card">
              <div class="card-top">
                <div class="model-name">
                  ${cleanLabel(m.label)}
                </div>
                <div class="pct-badge pct-${color}">${pctVal}%</div>
              </div>
              <div class="bar-bg">
                <div class="bar-fill fill-${color}" style="width: ${pctVal}%"></div>
              </div>
              <div class="reset-row">
                <span class="reset-countdown">${countdownStr}</span>
                <span class="reset-clock">${clockStr}</span>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="section">
            <div class="section-header">
              <span class="section-title">${title}</span>
              <div class="section-line"></div>
            </div>
            <div class="cards-list">
              ${cardsHtml}
            </div>
          </div>
        `;
      }

      let html = '';
      html += renderGroup('Quota Pools (Summary)', pools);
      html += renderGroup('Gemini 3.8 Flash', gemini38);
      html += renderGroup('Gemini 4 Argon', argon);
      html += renderGroup('Claude & GPT (Antigravity)', claude);
      html += renderGroup('Codex Limits (OpenAI)', codex);

      document.getElementById('content').innerHTML = html;
    }

    async function fetchData(manual = false) {
      const pulseDot = document.getElementById('pulse-dot');
      const syncTimeEl = document.getElementById('sync-time');
      
      try {
        const res = await fetch(`quota.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('Network error');
        rawData = await res.json();
        
        renderUI();
        
        const now = new Date();
        syncTimeEl.innerText = `${formatTime(now)}`;
        pulseDot.style.background = '#10b981';
        pulseDot.style.boxShadow = '0 0 8px #10b981';
      } catch (err) {
        console.error(err);
        syncTimeEl.innerText = 'Offline';
        pulseDot.style.background = '#ef4444';
        pulseDot.style.boxShadow = '0 0 8px #ef4444';
      }
    }

    // Initial load
    fetchData();

    // Auto fetch from cloud every 30 seconds
    setInterval(() => fetchData(), 30000);

    // Live tick for countdowns every 1 second
    setInterval(() => {
      if (rawData) renderUI();
    }, 1000);
  </script>
</body>
</html>
